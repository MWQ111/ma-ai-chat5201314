name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码规范检查（ruff）
        run: ruff check .

      - name: 运行测试（pytest）
        run: pytest -v
